name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          libgl1-mesa-dev
          libglu1-mesa-dev
          libpango1.0-dev
          libx11-dev
          libxcursor-dev
          libxext-dev
          libxfixes-dev
          libxft-dev
          libxinerama-dev
          libxrender-dev

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          libgl1-mesa-dev
          libglu1-mesa-dev
          libpango1.0-dev
          libx11-dev
          libxcursor-dev
          libxext-dev
          libxfixes-dev
          libxft-dev
          libxinerama-dev
          libxrender-dev

      - name: Install coverage tools
        run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce whole-project line coverage
        run: >-
          cargo llvm-cov
          --locked
          --all-targets
          --summary-only
          --fail-under-lines 60

      - name: Enforce deterministic core line coverage
        run: >-
          cargo llvm-cov report
          --summary-only
          --fail-under-lines 90
          --ignore-filename-regex
          '(^|/)(gui/.*|helpers/(clipboard_management|desktop_integration|file_execution)|main)\.rs$'
