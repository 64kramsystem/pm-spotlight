[package]
edition = "2021"
name = "pm-spotlight"
version = "0.1.0"

[profile.release]
strip = true

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
dirs = "6.0.0"
fltk = "=1.5.23"
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "open_uri"] }
async-io = "2.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }
